[package]
name = "binarypattern"
version = "0.1.0"
edition = "2021"

[dependencies]
# https://github.com/serde-rs/serde
# The core APIs, including the Serialize and Deserialize traits. Always
# required when using Serde. The "derive" feature is only required when
# using #[derive(Serialize, Deserialize)] to make Serde work with structs
# and enums defined in your crate.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# for serialisation ----------------------------------------------------------
bincode = "2.0.1"

# stack allocated vector and itertools ---------------------------------------
arrayvec = { version = "0.7.4", features = ["serde"] }
itertools = "0.15.0"
num-traits = "0.2.19"
ndarray = "0.17.2"
# hmmm 0.2.0 still requires ndarray 0.13 for its HMM arrays.
ndarray_013 = { package = "ndarray", version = "0.13.1" }

# random ----------------------------------------------
rand = { version = "0.10.3" }
# hmmm 0.2.0 still requires rand 0.7 for HMM::train.
rand_07 = { package = "rand", version = "0.7.3" }

# hidden markov ---------------------------------------
hmmm = { version = "0.2.0" }

